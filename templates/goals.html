{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Momentum — Goals</title>
<link rel="icon" type="image/svg+xml" href="{% static 'dashbord/img/favicon.svg' %}">
<link rel="stylesheet" href="{% static 'dashbord/css/style.css' %}">
</head>
<body>

<div class="momentum-app">

  <!-- ============================================================
       SIDEBAR
  ============================================================ -->
           {% include 'sidebar.html' %}
  <!-- ============================================================
       MAIN
  ============================================================ -->
  <div class="momentum-main">

    <!-- TOP BAR -->
    <header class="momentum-topbar">
      <div class="momentum-topbar__left">
        <button class="momentum-topbar__menu" id="sidebarOpen" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3.5 6.5H20.5M3.5 12H20.5M3.5 17.5H20.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
        <div class="momentum-topbar__date">
          <span id="todayDate">Monday, August 17</span>
        </div>
      </div>
      <div class="momentum-topbar__right">
        <button class="momentum-icon-btn" aria-label="Search">
          <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M20 20L16 16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
        <button class="momentum-icon-btn" aria-label="Notifications">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 10.5C6 7 8.7 4.5 12 4.5C15.3 4.5 18 7 18 10.5C18 15 19.5 16.2 19.5 16.2H4.5C4.5 16.2 6 15 6 10.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" fill="none"/><path d="M10 19.2C10.3 19.9 11.1 20.4 12 20.4C12.9 20.4 13.7 19.9 14 19.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span class="momentum-icon-btn__dot" aria-hidden="true"></span>
        </button>
        <a href="#" class="momentum-topbar__avatar" aria-label="Your profile">S</a>
      </div>
    </header>

    <div class="momentum-content">
      <div class="momentum-page-header">
        <div>
          <h1 class="momentum-page-header__title">Goals</h1>
          <p class="momentum-page-header__subtitle">The bigger picture behind the daily tasks.</p>
        </div>
        <button class="momentum-btn momentum-btn--primary" type="button" id="addGoalBtn">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Add Goal
        </button>
      </div>

      <section class="momentum-card" aria-labelledby="goalsHeading">
        <h2 class="momentum-card__title" id="goalsHeading" style="display:none;">Goals</h2>
        <ul class="momentum-goal-list">

          <li class="momentum-goal">
            <svg class="momentum-goal__ring" viewBox="0 0 44 44" aria-hidden="true">
              <circle cx="22" cy="22" r="18" class="momentum-goal__ring-track"/>
              <circle cx="22" cy="22" r="18" class="momentum-goal__ring-fill" style="--progress: 72;"/>
            </svg>
            <div class="momentum-goal__body">
              <p class="momentum-goal__title">Backend Developer</p>
              <div class="momentum-progress-bar">
                <div class="momentum-progress-bar__fill" style="width: 72%;"></div>
              </div>
            </div>
            <span class="momentum-goal__percent">72%</span>
          </li>

          <li class="momentum-goal">
            <svg class="momentum-goal__ring" viewBox="0 0 44 44" aria-hidden="true">
              <circle cx="22" cy="22" r="18" class="momentum-goal__ring-track"/>
              <circle cx="22" cy="22" r="18" class="momentum-goal__ring-fill" style="--progress: 48;"/>
            </svg>
            <div class="momentum-goal__body">
              <p class="momentum-goal__title">Build Momentum</p>
              <div class="momentum-progress-bar">
                <div class="momentum-progress-bar__fill" style="width: 48%;"></div>
              </div>
            </div>
            <span class="momentum-goal__percent">48%</span>
          </li>

          <li class="momentum-goal">
            <svg class="momentum-goal__ring" viewBox="0 0 44 44" aria-hidden="true">
              <circle cx="22" cy="22" r="18" class="momentum-goal__ring-track"/>
              <circle cx="22" cy="22" r="18" class="momentum-goal__ring-fill" style="--progress: 30;"/>
            </svg>
            <div class="momentum-goal__body">
              <p class="momentum-goal__title">Learn German (A2)</p>
              <div class="momentum-progress-bar">
                <div class="momentum-progress-bar__fill" style="width: 30%;"></div>
              </div>
            </div>
            <span class="momentum-goal__percent">30%</span>
          </li>

          <li class="momentum-goal">
            <svg class="momentum-goal__ring" viewBox="0 0 44 44" aria-hidden="true">
              <circle cx="22" cy="22" r="18" class="momentum-goal__ring-track"/>
              <circle cx="22" cy="22" r="18" class="momentum-goal__ring-fill" style="--progress: 85;"/>
            </svg>
            <div class="momentum-goal__body">
              <p class="momentum-goal__title">Finish Git roadmap</p>
              <div class="momentum-progress-bar">
                <div class="momentum-progress-bar__fill" style="width: 85%;"></div>
              </div>
            </div>
            <span class="momentum-goal__percent">85%</span>
          </li>

          <li class="momentum-goal">
            <svg class="momentum-goal__ring" viewBox="0 0 44 44" aria-hidden="true">
              <circle cx="22" cy="22" r="18" class="momentum-goal__ring-track"/>
              <circle cx="22" cy="22" r="18" class="momentum-goal__ring-fill" style="--progress: 10;"/>
            </svg>
            <div class="momentum-goal__body">
              <p class="momentum-goal__title">Start SQL course</p>
              <div class="momentum-progress-bar">
                <div class="momentum-progress-bar__fill" style="width: 10%;"></div>
              </div>
            </div>
            <span class="momentum-goal__percent">10%</span>
          </li>

        </ul>
      </section>
    </div>
  </div>
</div>

<script src="{% static 'dashbord/js/app.js' %}"></script>
</body>
</html>
