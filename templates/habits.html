{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Momentum — Habits</title>
<link rel="icon" type="image/svg+xml" href="{% static 'dashbord/img/favicon.svg' %}">
<link rel="stylesheet" href="{% static 'dashbord/css/style.css' %}">
</head>
<body>

<div class="momentum-app">

  <!-- ============================================================
       SIDEBAR
  ============================================================ -->
            {% include 'sidebar.html' %}
  <!-- ============================================================
       MAIN
  ============================================================ -->
  <div class="momentum-main">

    <!-- TOP BAR -->
    <header class="momentum-topbar">
      <div class="momentum-topbar__left">
        <button class="momentum-topbar__menu" id="sidebarOpen" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3.5 6.5H20.5M3.5 12H20.5M3.5 17.5H20.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
        <div class="momentum-topbar__date">
          <span id="todayDate">Monday, August 17</span>
        </div>
      </div>
      <div class="momentum-topbar__right">
        <button class="momentum-icon-btn" aria-label="Search">
          <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M20 20L16 16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
        <button class="momentum-icon-btn" aria-label="Notifications">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 10.5C6 7 8.7 4.5 12 4.5C15.3 4.5 18 7 18 10.5C18 15 19.5 16.2 19.5 16.2H4.5C4.5 16.2 6 15 6 10.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" fill="none"/><path d="M10 19.2C10.3 19.9 11.1 20.4 12 20.4C12.9 20.4 13.7 19.9 14 19.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span class="momentum-icon-btn__dot" aria-hidden="true"></span>
        </button>
        <a href="#" class="momentum-topbar__avatar" aria-label="Your profile">S</a>
      </div>
    </header>

    <div class="momentum-content">
      <div class="momentum-page-header">
        <div>
          <h1 class="momentum-page-header__title">Habits</h1>
          <p class="momentum-page-header__subtitle">Small things, done consistently.</p>
        </div>
        <button class="momentum-btn momentum-btn--primary" type="button" id="addHabitBtn">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Add Habit
        </button>
      </div>

      <div class="momentum-habit-grid">

        <div class="momentum-habit-card">
          <div class="momentum-habit-card__header">
            <div>
              <p class="momentum-habit-card__name">Morning walk</p>
              <p class="momentum-habit-card__frequency">Daily</p>
            </div>
            <span class="momentum-habit-card__streak">🔥 12</span>
          </div>
          <div class="momentum-habit-days" role="group" aria-label="This week">
            <div class="momentum-habit-day"><span class="momentum-habit-day__label">M</span><span class="momentum-habit-day__dot is-done"></span></div>
            <div class="momentum-habit-day"><span class="momentum-habit-day__label">T</span><span class="momentum-habit-day__dot is-done"></span></div>
            <div class="momentum-habit-day"><span class="momentum-habit-day__label">W</span><span class="momentum-habit-day__dot is-done"></span></div>
            <div class="momentum-habit-day"><span class="momentum-habit-day__label">T</span><span class="momentum-habit-day__dot is-done"></span></div>
            <div class="momentum-habit-day"><span class="momentum-habit-day__label">F</span><span class="momentum-habit-day__dot is-done"></span></div>
            <div class="momentum-habit-day"><span class="momentum-habit-day__label">S</span><span class="momentum-habit-day__dot is-done"></span></div>
            <div class="momentum-habit-day"><span class="momentum-habit-day__label">S</span><span class="momentum-habit-day__dot is-today"></span></div>
          </div>
        </div>

        <div class="momentum-habit-card">
          <div class="momentum-habit-card__header">
            <div>
              <p class="momentum-habit-card__name">German — 20 min</p>
              <p class="momentum-habit-card__frequency">Daily</p>
            </div>
            <span class="momentum-habit-card__streak">🔥 5</span>
          </div>
          <div class="momentum-habit-days" role="group" aria-label="This week">
            <div class="momentum-habit-day"><span class="momentum-habit-day__label">M</span><span class="momentum-habit-day__dot"></span></div>
            <div class="momentum-habit-day"><span class="momentum-habit-day__label">T</span><span class="momentum-habit-day__dot is-done"></span></div>
            <div class="momentum-habit-day"><span class="momentum-habit-day__label">W</span><span class="momentum-habit-day__dot is-done"></span></div>
            <div class="momentum-habit-day"><span class="momentum-habit-day__label">T</span><span class="momentum-habit-day__dot is-done"></span></div>
            <div class="momentum-habit-day"><span class="momentum-habit-day__label">F</span><span class="momentum-habit-day__dot is-done"></span></div>
            <div class="momentum-habit-day"><span class="momentum-habit-day__label">S</span><span class="momentum-habit-day__dot is-done"></span></div>
            <div class="momentum-habit-day"><span class="momentum-habit-day__label">S</span><span class="momentum-habit-day__dot is-today"></span></div>
          </div>
        </div>

        <div class="momentum-habit-card">
          <div class="momentum-habit-card__header">
            <div>
              <p class="momentum-habit-card__name">Read 10 pages</p>
              <p class="momentum-habit-card__frequency">Daily</p>
            </div>
            <span class="momentum-habit-card__streak">🔥 2</span>
          </div>
          <div class="momentum-habit-days" role="group" aria-label="This week">
            <div class="momentum-habit-day"><span class="momentum-habit-day__label">M</span><span class="momentum-habit-day__dot"></span></div>
            <div class="momentum-habit-day"><span class="momentum-habit-day__label">T</span><span class="momentum-habit-day__dot"></span></div>
            <div class="momentum-habit-day"><span class="momentum-habit-day__label">W</span><span class="momentum-habit-day__dot"></span></div>
            <div class="momentum-habit-day"><span class="momentum-habit-day__label">T</span><span class="momentum-habit-day__dot"></span></div>
            <div class="momentum-habit-day"><span class="momentum-habit-day__label">F</span><span class="momentum-habit-day__dot is-done"></span></div>
            <div class="momentum-habit-day"><span class="momentum-habit-day__label">S</span><span class="momentum-habit-day__dot is-done"></span></div>
            <div class="momentum-habit-day"><span class="momentum-habit-day__label">S</span><span class="momentum-habit-day__dot is-today"></span></div>
          </div>
        </div>

        <div class="momentum-habit-card">
          <div class="momentum-habit-card__header">
            <div>
              <p class="momentum-habit-card__name">Gym session</p>
              <p class="momentum-habit-card__frequency">3x / week</p>
            </div>
            <span class="momentum-habit-card__streak">🔥 3</span>
          </div>
          <div class="momentum-habit-days" role="group" aria-label="This week">
            <div class="momentum-habit-day"><span class="momentum-habit-day__label">M</span><span class="momentum-habit-day__dot is-done"></span></div>
            <div class="momentum-habit-day"><span class="momentum-habit-day__label">T</span><span class="momentum-habit-day__dot"></span></div>
            <div class="momentum-habit-day"><span class="momentum-habit-day__label">W</span><span class="momentum-habit-day__dot is-done"></span></div>
            <div class="momentum-habit-day"><span class="momentum-habit-day__label">T</span><span class="momentum-habit-day__dot"></span></div>
            <div class="momentum-habit-day"><span class="momentum-habit-day__label">F</span><span class="momentum-habit-day__dot is-done"></span></div>
            <div class="momentum-habit-day"><span class="momentum-habit-day__label">S</span><span class="momentum-habit-day__dot"></span></div>
            <div class="momentum-habit-day"><span class="momentum-habit-day__label">S</span><span class="momentum-habit-day__dot is-today"></span></div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="{% static 'dashbord/js/app.js' %}"></script>
</body>
</html>
